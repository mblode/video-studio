name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # macOS is not optional here: title cards are rasterised with qlmanage and
    # sips, so that path only ever runs on a darwin runner. It went unexercised
    # for the whole life of the ubuntu-only workflow that preceded this one.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # Must match the engines.node floor in package.json.
          node-version: 24
          cache: npm

      - name: Install ffmpeg
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null; then
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              brew install ffmpeg
            else
              sudo apt-get update
              sudo apt-get install --yes ffmpeg
            fi
          fi
          ffmpeg -version
          ffprobe -version

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
