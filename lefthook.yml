pre-commit:
  jobs:
    # {staged_files} is load-bearing. Without it `ultracite fix` walks the whole
    # repo, and stage_fixed then sweeps every unrelated reformatted file into
    # the commit you were trying to keep small.
    # JSON is formatted by oxfmt via ultracite, but oxlint has nothing to do
    # with it and exits 1 ("No files found to lint") — keep json out of this
    # glob so docs-only commits (docs.json + MDX) are not blocked.
    - run: npx ultracite fix {staged_files}
      glob:
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.css"
      stage_fixed: true
